<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Left vertical path -->
  <rect x="8" y="6" width="4" height="28" rx="2" fill="#5A2D5F"/>
  <!-- Right vertical path -->
  <rect x="28" y="6" width="4" height="28" rx="2" fill="#5A2D5F"/>
  <!-- Central waypoint connecting both paths -->
  <circle cx="20" cy="20" r="4" fill="#5A2D5F"/>
  <!-- Subtle connection lines -->
  <line x1="12" y1="20" x2="16" y2="20" stroke="#5A2D5F" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="20" x2="28" y2="20" stroke="#5A2D5F" stroke-width="2" stroke-linecap="round"/>
</svg>
